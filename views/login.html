<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Mini-IdP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1117;
    color: #e4e4e7;
  }
  body::before {
    content: '';
    position: fixed;
    top: -40%; left: -20%;
    width: 80%; height: 80%;
    background: radial-gradient(ellipse, rgba(99,102,241,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -30%; right: -10%;
    width: 60%; height: 60%;
    background: radial-gradient(ellipse, rgba(16,185,129,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .card {
    width: 100%; max-width: 400px;
    background: rgba(24,24,32,0.85);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 48px 40px 40px;
    position: relative;
    z-index: 1;
    box-shadow: 0 24px 80px rgba(0,0,0,0.4);
  }
  .logo {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, #6366f1, #10b981);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
    font-size: 20px; font-weight: 700; color: #fff;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { color: #71717a; font-size: 14px; margin-bottom: 32px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #a1a1aa;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  input[type="email"], input[type="password"] {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    color: #e4e4e7;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    margin-bottom: 20px;
  }
  input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
  }
  input::placeholder { color: #52525b; }
  button {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    margin-top: 4px;
  }
  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(99,102,241,0.35);
  }
  button:active { transform: translateY(0); }
  .error {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.2);
    color: #fca5a5;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .footer {
    text-align: center;
    margin-top: 24px;
    color: #52525b;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">ID</div>
    <h1>Sign in</h1>
    <p class="subtitle">Enter your credentials to continue</p>

    <div class="error" id="error" style="display:none"></div>

    <form method="POST" action="/sso/login">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@company.com" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>

      <button type="submit">Sign in</button>
    </form>

    <div class="footer">Secured by Mini-IdP</div>
  </div>

  <script>
    if (location.search.includes('error=invalid')) {
      const el = document.getElementById('error');
      el.textContent = 'Invalid email or password. Please try again.';
      el.style.display = 'block';
    }
  </script>
</body>
</html>
