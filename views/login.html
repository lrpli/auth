<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Mini-IdP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef4ff;
    color: #0f172a;
  }
  body::before {
    content: '';
    position: fixed;
    top: -40%; left: -20%;
    width: 80%; height: 80%;
    background: radial-gradient(ellipse, rgba(56,189,248,0.24) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -30%; right: -10%;
    width: 60%; height: 60%;
    background: radial-gradient(ellipse, rgba(59,130,246,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .card {
    width: 100%; max-width: 400px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(15,23,42,0.12);
    border-radius: 20px;
    padding: 48px 40px 40px;
    position: relative;
    z-index: 1;
    box-shadow: 0 20px 48px rgba(37,99,235,0.15);
  }
  .logo {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, #2563eb, #14b8a6);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
    font-size: 20px; font-weight: 700; color: #fff;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { color: #475569; font-size: 14px; margin-bottom: 32px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #334155;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    color: #0f172a;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    margin-bottom: 20px;
  }
  input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
  }
  input::placeholder { color: #94a3b8; }
  .submit-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #2563eb, #0284c7);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    margin-top: 4px;
  }
  .submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 22px rgba(37,99,235,0.28);
  }
  .submit-btn:active { transform: translateY(0); }
  .error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .captcha-block {
    display: none;
    margin-bottom: 20px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #93c5fd;
    background: #eaf2ff;
  }
  .captcha-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .captcha-question {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: #1d4ed8;
    letter-spacing: 0.04em;
    font-size: 14px;
    flex: 1;
  }
  .captcha-refresh {
    border: 1px solid #93c5fd;
    border-radius: 8px;
    background: #ffffff;
    color: #1e3a8a;
    font-size: 13px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .captcha-refresh:hover {
    border-color: #2563eb;
    color: #1e40af;
  }
  .captcha-tip {
    margin-top: -12px;
    margin-bottom: 10px;
    color: #475569;
    font-size: 12px;
  }
  .footer {
    text-align: center;
    margin-top: 24px;
    color: #64748b;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">ID</div>
    <h1>Sign in</h1>
    <p class="subtitle">Enter your credentials to continue</p>

    <div class="error" id="error" style="display:none"></div>

    <form method="POST" action="/sso/login">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@company.com" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>

      <div class="captcha-block" id="captcha-block">
        <label for="captcha_answer">Verification</label>
        <div class="captcha-row">
          <div class="captcha-question" id="captcha-question">Loading...</div>
          <button type="button" class="captcha-refresh" id="captcha-refresh">Refresh</button>
        </div>
        <input type="text" id="captcha_answer" name="captcha_answer" placeholder="Enter result" autocomplete="off">
      </div>
      <p class="captcha-tip" id="captcha-tip" style="display:none">Multiple failed attempts detected. Verification is required.</p>

      <button class="submit-btn" type="submit">Sign in</button>
    </form>

    <div class="footer">Secured by Mini-IdP</div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const error = params.get('error');
    const retry = parseInt(params.get('retry') || '0', 10);
    const errorEl = document.getElementById('error');
    const captchaBlock = document.getElementById('captcha-block');
    const captchaTip = document.getElementById('captcha-tip');
    const captchaInput = document.getElementById('captcha_answer');
    const captchaQuestion = document.getElementById('captcha-question');
    const captchaRefresh = document.getElementById('captcha-refresh');

    if (error === 'invalid') {
      errorEl.textContent = 'Invalid email or password. Please try again.';
      errorEl.style.display = 'block';
    } else if (error === 'captcha') {
      errorEl.textContent = 'Verification failed. Please try again.';
      errorEl.style.display = 'block';
    } else if (error === 'locked') {
      errorEl.textContent = `Too many failed attempts. Try again in ${retry || 60} seconds.`;
      errorEl.style.display = 'block';
    }

    async function loadCaptcha() {
      try {
        const res = await fetch('/auth/captcha?scope=sso', { credentials: 'same-origin' });
        if (!res.ok) throw new Error('captcha request failed');
        const data = await res.json();
        captchaQuestion.textContent = data.question || 'Retry verification';
      } catch (_) {
        captchaQuestion.textContent = 'Unable to load verification. Refresh page.';
      }
    }

    function enableCaptcha() {
      captchaBlock.style.display = 'block';
      captchaTip.style.display = 'block';
      captchaInput.required = true;
      loadCaptcha();
    }

    captchaRefresh.addEventListener('click', () => {
      loadCaptcha();
    });

    if (params.get('captcha') === '1' || error === 'captcha' || error === 'locked') {
      enableCaptcha();
    }
  </script>
</body>
</html>
