<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Mini-IdP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1117;
    color: #e4e4e7;
  }
  body::before {
    content: '';
    position: fixed;
    top: -40%; right: -20%;
    width: 70%; height: 70%;
    background: radial-gradient(ellipse, rgba(245,158,11,0.1) 0%, transparent 70%);
    pointer-events: none;
  }
  .card {
    width: 100%; max-width: 400px;
    background: rgba(24,24,32,0.85);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 48px 40px 40px;
    position: relative; z-index: 1;
    box-shadow: 0 24px 80px rgba(0,0,0,0.4);
  }
  .logo {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
    font-size: 18px; font-weight: 700; color: #fff;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { color: #71717a; font-size: 14px; margin-bottom: 32px; }
  label { display: block; font-size: 13px; font-weight: 500; color: #a1a1aa; margin-bottom: 6px; }
  input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    color: #e4e4e7;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    margin-bottom: 20px;
  }
  input:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.15); }
  input::placeholder { color: #52525b; }
  button {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(245,158,11,0.3); }
  .error {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.2);
    color: #fca5a5;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">⚙</div>
    <h1>Admin Panel</h1>
    <p class="subtitle">Sign in to manage your IdP</p>
    <div class="error" id="error" style="display:none">Invalid credentials</div>
    <form method="POST" action="/admin/login">
      <label>Username</label>
      <input type="text" name="username" placeholder="admin" required autofocus>
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    if (location.search.includes('error=1')) document.getElementById('error').style.display = 'block';
  </script>
</body>
</html>
