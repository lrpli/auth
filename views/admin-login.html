<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Mini-IdP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e9f8ff;
    color: #0f172a;
  }
  body::before {
    content: '';
    position: fixed;
    top: -40%; right: -20%;
    width: 70%; height: 70%;
    background: radial-gradient(ellipse, rgba(14,165,233,0.28) 0%, transparent 70%);
    pointer-events: none;
  }
  .card {
    width: 100%; max-width: 400px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(2,132,199,0.2);
    border-radius: 20px;
    padding: 48px 40px 40px;
    position: relative; z-index: 1;
    box-shadow: 0 20px 48px rgba(2,132,199,0.2);
  }
  .logo {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, #0ea5e9, #14b8a6);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
    font-size: 18px; font-weight: 700; color: #fff;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { color: #0369a1; font-size: 14px; margin-bottom: 32px; }
  label { display: block; font-size: 13px; font-weight: 500; color: #0f172a; margin-bottom: 6px; }
  input {
    width: 100%;
    background: #ffffff;
    border: 1px solid #7dd3fc;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    color: #0f172a;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    margin-bottom: 20px;
  }
  input:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2,132,199,0.16); }
  input::placeholder { color: #a8a29e; }
  .hint {
    margin-top: -12px;
    margin-bottom: 14px;
    color: #475569;
    font-size: 12px;
  }
  .submit-btn {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, #0ea5e9, #0284c7);
    color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  }
  .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(2,132,199,0.28); }
  .error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .captcha-block {
    display: none;
    margin-bottom: 20px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #38bdf8;
    background: #eaf8ff;
  }
  .captcha-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .captcha-question {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: #0369a1;
    letter-spacing: 0.04em;
    font-size: 14px;
    flex: 1;
  }
  .captcha-refresh {
    border: 1px solid #7dd3fc;
    border-radius: 8px;
    background: #ffffff;
    color: #075985;
    font-size: 13px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .captcha-refresh:hover {
    border-color: #0284c7;
    color: #0c4a6e;
  }
  .captcha-tip {
    margin-top: -12px;
    margin-bottom: 10px;
    color: #0369a1;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">⚙</div>
    <h1>Admin Panel</h1>
    <p class="subtitle">Sign in to manage your IdP</p>
    <div class="error" id="error" style="display:none">Invalid credentials</div>
    <form method="POST" action="/admin/login">
      <label>Username</label>
      <input type="text" name="username" placeholder="admin" required autofocus>
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
      <label>2FA Code</label>
      <input type="text" name="otp_code" placeholder="123456" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
      <p class="hint">If 2FA is enabled, enter your authenticator app code.</p>
      <div class="captcha-block" id="captcha-block">
        <label for="captcha_answer">Verification</label>
        <div class="captcha-row">
          <div class="captcha-question" id="captcha-question">Loading...</div>
          <button type="button" class="captcha-refresh" id="captcha-refresh">Refresh</button>
        </div>
        <input type="text" id="captcha_answer" name="captcha_answer" placeholder="Enter result" autocomplete="off">
      </div>
      <p class="captcha-tip" id="captcha-tip" style="display:none">Multiple failed attempts detected. Verification is required.</p>
      <button class="submit-btn" type="submit">Sign in</button>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const error = params.get('error');
    const retry = parseInt(params.get('retry') || '0', 10);
    const errorEl = document.getElementById('error');
    const captchaBlock = document.getElementById('captcha-block');
    const captchaTip = document.getElementById('captcha-tip');
    const captchaInput = document.getElementById('captcha_answer');
    const captchaQuestion = document.getElementById('captcha-question');
    const captchaRefresh = document.getElementById('captcha-refresh');

    if (error === 'invalid' || error === '1') {
      errorEl.textContent = 'Invalid username or password.';
      errorEl.style.display = 'block';
    } else if (error === 'totp_required') {
      errorEl.textContent = '2FA code is required for this admin account.';
      errorEl.style.display = 'block';
    } else if (error === 'totp_invalid') {
      errorEl.textContent = 'Invalid 2FA code.';
      errorEl.style.display = 'block';
    } else if (error === 'captcha') {
      errorEl.textContent = 'Verification failed. Please try again.';
      errorEl.style.display = 'block';
    } else if (error === 'locked') {
      errorEl.textContent = `Too many failed attempts. Try again in ${retry || 60} seconds.`;
      errorEl.style.display = 'block';
    }

    async function loadCaptcha() {
      try {
        const res = await fetch('/auth/captcha?scope=admin', { credentials: 'same-origin' });
        if (!res.ok) throw new Error('captcha request failed');
        const data = await res.json();
        captchaQuestion.textContent = data.question || 'Retry verification';
      } catch (_) {
        captchaQuestion.textContent = 'Unable to load verification. Refresh page.';
      }
    }

    function enableCaptcha() {
      captchaBlock.style.display = 'block';
      captchaTip.style.display = 'block';
      captchaInput.required = true;
      loadCaptcha();
    }

    captchaRefresh.addEventListener('click', () => {
      loadCaptcha();
    });

    if (params.get('captcha') === '1' || error === 'captcha' || error === 'locked') {
      enableCaptcha();
    }
  </script>
</body>
</html>
